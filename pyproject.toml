[project]
name = "testoracle"
version = "1.0.0"
description = "Input and oracle errors in unit tests generated by language models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oleksandr Kholodniak", email = "o.o.kholodniak@khai.edu" }]
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
testoracle = "testoracle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
